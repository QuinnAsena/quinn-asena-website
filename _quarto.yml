project:
  type: website
  # The CV PDF is built from the Typst source in the CV-typst repo and copied here, so
  # the link cannot break independently of this site. Update both together.
  resources:
    - cv/
    # Only the licence: Quarto already copies the woff2 itself as a CSS dependency,
    # so listing all of fonts/ here would ship the font twice.
    - fonts/OFL.txt

website:
  title: "Quinn Asena"
  # Required for absolute links in the RSS feed and on the 404 page, which can be
  # served from any URL depth and so cannot rely on relative paths.
  site-url: https://quinnasena.github.io/quinn-asena-website/
  description: "Quinn Asena, ecologist and data scientist. Wildfire risk mapping with deep learning, boreal forest dynamics under climate change, and statistical methods for long-term ecological change."
  favicon: favicon.ico
  google-analytics: "G-HT71J1MK87"
  navbar:
    toggle-position: right
    search: true
    left:
      # Labels are deliberately shorter than the filenames so the bar stays on one
      # row. Filenames are unchanged, so existing URLs keep working.
      - href: my-research.qmd
        text: Research
      - href: talks.qmd
        text: Talks
      - href: workshops-lectures.qmd
        text: Teaching
      - href: packages-apps.qmd
        text: Software
      - href: about.qmd
        text: About
      - href: personal.qmd
        text: Personal
      - href: cv.qmd
        text: CV
    right:
      - icon: envelope
        href: mailto:asenaq@caryinstitute.org
      - icon: github
        href: https://github.com/QuinnAsena
      - icon: linkedin
        href: https://www.linkedin.com/in/quinn-asena-a394202a4/
      - icon: fingerprint
        menu:
          - text: ORCID
            href: https://orcid.org/0000-0002-4086-460X
          - text: Cary Institute of Ecosystem Studies
            href: https://www.caryinstitute.org/science/research-support/quinn-asena
          - text: Forest Futures lab
            href: https://forestfutureslab.org/
          - text: Ives Lab
            href: https://ives.labs.wisc.edu/people/
          - text: Williams Lab
            href: https://williamspaleolab.github.io/people/
          - text: Perry Lab
            href: https://spatialecol.com/
  page-footer:
    # No year: a hardcoded one silently goes stale every January.
    left: "© Quinn Asena"
    right:
      - icon: envelope
        href: mailto:asenaq@caryinstitute.org
      - icon: github
        href: https://github.com/QuinnAsena
      - icon: linkedin
        href: https://www.linkedin.com/in/quinn-asena-a394202a4/

format:
  html:
    # Both modes share lux + styles.scss so the type, spacing and card system are
    # defined once; styles-dark.scss only overrides colour. Quarto adds the toggle.
    theme:
      light:
        - lux
        - styles.scss
      dark:
        - lux
        - styles.scss
        - styles-dark.scss
    toc: true
    link-external-newwindow: true


