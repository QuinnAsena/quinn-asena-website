project:
  type: website
  # The CV PDF is built from the Typst source in the CV-typst repo and copied here, so
  # the link cannot break independently of this site. Update both together.
  resources:
    - cv/
    # Only the licence: Quarto already copies the woff2 itself as a CSS dependency,
    # so listing all of fonts/ here would ship the font twice.
    - fonts/OFL.txt

website:
  title: "Quinn Asena"
  # Required for absolute links in the RSS feed and on the 404 page, which can be
  # served from any URL depth and so cannot rely on relative paths.
  site-url: https://quinnasena.github.io/quinn-asena-website/
  description: "Quinn Asena, ecologist and data scientist. Wildfire risk mapping with deep learning, boreal forest dynamics under climate change, and statistical methods for long-term ecological change."
  favicon: favicon.ico
  google-analytics: "G-HT71J1MK87"
  # Without these, sharing any page on LinkedIn, Bluesky, Slack or in an email renders
  # a bare URL with no title, image or summary. site-url above makes the generated
  # image and canonical URLs absolute, which these tags require.
  open-graph:
    image: images/og-card.jpg
    image-alt: "Quinn Asena, ecologist and data scientist. Palaeoecology, wildfire risk, boreal forests."
  twitter-card:
    card-style: summary_large_image
    image: images/og-card.jpg
    image-alt: "Quinn Asena, ecologist and data scientist. Palaeoecology, wildfire risk, boreal forests."
  # Must sit at website level, not under navbar: under navbar it only hides the search
  # box and still ships the JS. Search costs ~45 KB across four requests (fuse,
  # autocomplete, quarto-search) to index 13 pages, and browsing a seven-item navbar
  # is faster than searching.
  search: false
  navbar:
    toggle-position: right
    left:
      # Labels are deliberately shorter than the filenames so the bar stays on one
      # row. Filenames are unchanged, so existing URLs keep working.
      - href: my-research.qmd
        text: Research
      - href: talks.qmd
        text: Talks
      - href: workshops-lectures.qmd
        text: Teaching
      - href: packages-apps.qmd
        text: Software
      - href: about.qmd
        text: About
      - href: personal.qmd
        text: Personal
      - href: cv.qmd
        text: CV
    right:
      - icon: envelope
        href: mailto:asenaq@caryinstitute.org
      - icon: github
        href: https://github.com/QuinnAsena
      - icon: linkedin
        href: https://www.linkedin.com/in/quinn-asena-a394202a4/
      - icon: fingerprint
        menu:
          - text: Google Scholar
            href: "https://scholar.google.com/citations?user=eKltz04AAAAJ"
          - text: ORCID
            href: https://orcid.org/0000-0002-4086-460X
          - text: Cary Institute of Ecosystem Studies
            href: https://www.caryinstitute.org/science/research-support/quinn-asena
          - text: Forest Futures lab
            href: https://forestfutureslab.org/
          - text: Ives Lab
            href: https://ives.labs.wisc.edu/people/
          - text: Williams Lab
            href: https://williamspaleolab.github.io/people/
          - text: Perry Lab
            href: https://spatialecol.com/
  page-footer:
    # No year: a hardcoded one silently goes stale every January.
    #
    # The licence is stated here rather than only in LICENSE, because a bare © reads as
    # all rights reserved, which contradicts the reuse the Teaching and Research pages
    # invite. Copyright is still retained; CC BY-NC grants the permission on top of it.
    left: "© Quinn Asena · Content [CC BY-NC 4.0](https://creativecommons.org/licenses/by-nc/4.0/)"
    right:
      - icon: envelope
        href: mailto:asenaq@caryinstitute.org
      - icon: github
        href: https://github.com/QuinnAsena
      - icon: linkedin
        href: https://www.linkedin.com/in/quinn-asena-a394202a4/

format:
  html:
    # Both modes share lux + styles.scss so the type, spacing and card system are
    # defined once; styles-dark.scss only overrides colour. Quarto adds the toggle.
    #
    # dark is listed first, which makes it the default for a first-time visitor.
    # Returning visitors keep whatever they last chose, which Quarto stores locally.
    theme:
      dark:
        - lux
        - styles.scss
        - styles-dark.scss
      light:
        - lux
        - styles.scss
    toc: true
    link-external-newwindow: true


